services:
  - type: web
    name: planillas-chincha-api
    env: docker
    repo: https://github.com/edinson-cardenas/ugel-chincha-boletas.git
    branch: main
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://ugel-chincha-planillas.vercel.app,http://localhost:5173
      - key: PORT
        value: "8080"
    healthCheckPath: /health

# NOTA: Para Supabase, crear la connection string en el dashboard de Render
# como variable de entorno secreta (sync: false).
# Connection string Supabase:
# DATABASE_URL=postgresql://postgres:[PASSWORD]@db.[PROJECT_ID].supabase.co:6543/postgres
